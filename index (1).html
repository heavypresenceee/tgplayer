<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>MusicWeb v3</title>
<link rel="manifest" href="data:application/json,{&quot;name&quot;:&quot;MusicWeb&quot;,&quot;short_name&quot;:&quot;MusicWeb&quot;,&quot;start_url&quot;:&quot;/&quot;,&quot;display&quot;:&quot;standalone&quot;,&quot;background_color&quot;:&quot;#07001a&quot;,&quot;theme_color&quot;:&quot;#f72585&quot;}"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --pink:#f72585;--purple:#7209b7;--blue:#3a0ca3;--cyan:#4cc9f0;
  --bg:#07001a;--bg2:#0e0028;--bg3:#16003a;
  --glass:rgba(255,255,255,0.06);--border:rgba(255,255,255,0.1);
  --text:rgba(255,255,255,0.9);--muted:rgba(255,255,255,0.5);
}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;display:flex;flex-direction:column}
.app-container{display:flex;flex:1;height:calc(100vh - 70px);overflow:hidden;position:relative}
.main-content{flex:1;overflow-y:auto;padding:30px;padding-bottom:120px;position:relative;z-index:1}
.nav-bar{display:flex;gap:10px;background:rgba(14,0,40,0.6);backdrop-filter:blur(20px);padding:15px 30px;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10}
.nav-item{padding:10px 20px;border-radius:20px;cursor:pointer;font-weight:500;color:var(--muted);transition:all 0.3s;display:flex;align-items:center;gap:8px}
.nav-item:hover{background:var(--glass);color:var(--text)}
.nav-item.active{background:linear-gradient(45deg,var(--pink),var(--purple));color:#fff;box-shadow:0 4px 15px rgba(247,37,133,0.4)}
.page{display:none;animation:fadeIn 0.4s ease forwards}
.page.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.player-layout{display:grid;grid-template-columns:350px 1fr;gap:30px;height:100%;align-items:start}
.queue-side{background:var(--bg2);border:1px solid var(--border);border-radius:24px;padding:20px;height:calc(100vh - 160px);display:flex;flex-direction:column}
.queue-title{font-size:1.2rem;font-weight:700;margin-bottom:15px;color:#fff;letter-spacing:-0.5px}
.queue-scroll{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding-right:4px}
.player-side{background:linear-gradient(135deg,var(--bg3),var(--bg2));border:1px solid var(--border);border-radius:32px;padding:40px;display:flex;flex-direction:column;align-items:center;text-align:center;position:relative;box-shadow:0 20px 50px rgba(0,0,0,0.3);height:calc(100vh - 160px);justify-content:center}
.cover-wrapper{position:relative;width:300px;height:300px;margin-bottom:30px;border-radius:24px;box-shadow:0 15px 35px rgba(0,0,0,0.5);overflow:hidden;background:var(--bg3)}
.cover-img{width:100%;height:100%;object-fit:cover;transition:transform 0.5s}
.cover-wrapper:hover .cover-img{transform:scale(1.04)}
.platform-badge{position:absolute;top:15px;right:15px;background:rgba(0,0,0,0.75);backdrop-filter:blur(5px);padding:4px 10px;border-radius:12px;font-size:0.75rem;font-weight:700;text-transform:uppercase;letter-spacing:1px;border:1px solid rgba(255,255,255,0.15)}
.platform-badge.sc{color:#ff5500;border-color:rgba(255,85,0,0.4)}
.platform-badge.yt{color:#ff0000;border-color:rgba(255,0,0,0.4)}
.platform-badge.dz{color:#00ff00;border-color:rgba(0,255,0,0.4)}
.track-meta{margin-bottom:25px;width:100%;max-width:450px}
.track-title{font-size:1.6rem;font-weight:700;color:#fff;margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track-artist{font-size:1.05rem;color:var(--cyan);cursor:pointer;transition:opacity 0.2s;display:inline-block}
.track-artist:hover{opacity:0.8;text-decoration:underline}
.action-row{display:flex;gap:10px;margin-bottom:30px;width:100%;max-width:450px;justify-content:center}
.btn-action{background:var(--glass);border:1px solid var(--border);padding:10px 16px;border-radius:20px;color:var(--text);font-size:0.85rem;font-weight:500;cursor:pointer;transition:all 0.2s;display:flex;align-items:center;gap:6px}
.btn-action:hover{background:rgba(255,255,255,0.12);transform:translateY(-1px)}
.btn-action.active-like{background:rgba(247,37,133,0.15);border-color:var(--pink);color:var(--pink)}
.btn-action.active-wave{background:rgba(76,201,240,0.15);border-color:var(--cyan);color:var(--cyan);animation:pulseGlow 2s infinite}
@keyframes pulseGlow{0%{box-shadow:0 0 0 0 rgba(76,201,240,0.4)}70%{box-shadow:0 0 0 10px rgba(76,201,240,0)}100%{box-shadow:0 0 0 0 rgba(76,201,240,0)}}
.timeline-container{width:100%;max-width:450px;margin-bottom:30px}
.time-slider{width:100%;-webkit-appearance:none;appearance:none;height:5px;border-radius:3px;background:rgba(255,255,255,0.1);outline:none;cursor:pointer;transition:background 0.3s}
.time-slider::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--pink);cursor:pointer;transition:transform 0.1s}
.time-slider::-webkit-slider-thumb:hover{transform:scale(1.3)}
.time-info{display:flex;justify-content:between;font-size:0.75rem;color:var(--muted);margin-top:8px}
.controls-row{display:flex;align-items:center;gap:25px}
.btn-ctrl{background:none;border:none;color:var(--text);cursor:pointer;transition:all 0.2s;display:flex;align-items:center;justify-content:center}
.btn-ctrl:hover{color:var(--pink);transform:scale(1.08)}
.btn-play-trigger{width:64px;height:64px;border-radius:50%;background:linear-gradient(45deg,var(--pink),var(--purple));color:#fff;box-shadow:0 6px 20px rgba(247,37,133,0.4)}
.btn-play-trigger:hover{transform:scale(1.05);box-shadow:0 8px 25px rgba(247,37,133,0.6)}
.vol-container{position:absolute;bottom:40px;right:40px;display:flex;align-items:center;gap:10px;background:rgba(0,0,0,0.2);padding:8px 15px;border-radius:20px;border:1px solid var(--border)}
.vol-slider{width:8px;height:80px;-webkit-appearance:slider-vertical;writing-mode:bt-lr}
.search-box{background:var(--bg2);border:1px solid var(--border);border-radius:20px;padding:20px;margin-bottom:30px;display:flex;gap:15px;align-items:center}
.search-input{flex:1;background:rgba(0,0,0,0.3);border:1px solid var(--border);padding:12px 20px;border-radius:14px;color:#fff;font-size:1rem;outline:none;transition:border-color 0.3s}
.search-input:focus{border-color:var(--pink)}
.source-filters{display:flex;gap:8px}
.filter-chip{padding:8px 16px;border-radius:12px;border:1px solid var(--border);font-size:0.85rem;font-weight:600;cursor:pointer;transition:all 0.2s;background:var(--glass);color:var(--muted)}
.filter-chip.active{background:var(--text);color:var(--bg);border-color:#fff}
.track-row{display:flex;align-items:center;padding:10px;border-radius:14px;cursor:pointer;transition:all 0.2s;gap:12px;border:1px solid transparent}
.track-row:hover{background:var(--glass);border-color:var(--border)}
.track-row.playing{background:rgba(247,37,133,0.08);border-color:rgba(247,37,133,0.2)}
.track-row.playing .tr-title{color:var(--pink)}
.tr-cover{width:44px;height:44px;border-radius:8px;object-fit:cover;background:var(--bg3)}
.tr-meta{flex:1;min-width:0}
.tr-title{font-size:0.9rem;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:2px}
.tr-artist{font-size:0.8rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr-duration{font-size:0.8rem;color:var(--muted);padding-right:5px}
.grid-container{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:20px;margin-top:20px}
.media-tile{background:linear-gradient(135deg,var(--bg2),var(--bg3));border:1px solid var(--border);border-radius:20px;padding:25px 20px;text-align:center;cursor:pointer;transition:all 0.3s;box-shadow:0 4px 15px rgba(0,0,0,0.15)}
.media-tile:hover{transform:translateY(-4px);border-color:var(--pink);box-shadow:0 8px 25px rgba(247,37,133,0.15)}
.tile-icon{font-size:2rem;margin-bottom:12px;display:block}
.tile-title{font-size:1rem;font-weight:600;color:#fff}
.scroll-row{display:flex;gap:15px;overflow-x:auto;padding-bottom:15px;scroll-behavior:smooth}
.mix-card{flex:0 0 200px;background:var(--bg2);border:1px solid var(--border);border-radius:20px;padding:20px;cursor:pointer;transition:all 0.2s;text-align:center}
.mix-card:hover{border-color:var(--cyan);background:var(--bg3);transform:translateY(-2px)}
.mix-icon{font-size:2.5rem;margin-bottom:15px;display:block}
.section-title{font-size:1.3rem;font-weight:700;color:#fff;margin:25px 0 15px 0;letter-spacing:-0.5px;display:flex;align-items:center;gap:8px}
.toast-msg{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(20px);background:rgba(247,37,133,0.9);backdrop-filter:blur(10px);color:#fff;padding:12px 28px;border-radius:30px;font-size:0.9rem;font-weight:600;box-shadow:0 10px 30px rgba(247,37,133,0.3);z-index:1000;opacity:0;pointer-events:none;transition:all 0.3s ease}
.toast-msg.show{opacity:1;transform:translateX(-50%) translateY(0)}
.modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(7,0,26,0.8);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;z-index:2000;opacity:0;pointer-events:none;transition:opacity 0.3s}
.modal.open{opacity:1;pointer-events:auto}
.modal-content{background:var(--bg2);border:1px solid var(--border);border-radius:24px;padding:30px;width:100%;max-width:400px;box-shadow:0 20px 50px rgba(0,0,0,0.5)}
.modal-title{font-size:1.2rem;font-weight:700;color:#fff;margin-bottom:20px}
.modal-list{max-height:200px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;margin-bottom:20px}
.modal-row{padding:12px 15px;background:var(--glass);border-radius:12px;cursor:pointer;font-weight:500;transition:all 0.2s}
.modal-row:hover{background:rgba(255,255,255,0.12);color:var(--pink)}
.modal-input-group{display:flex;gap:10px}
.modal-btn-close{float:right;background:none;border:none;color:var(--muted);font-size:1.2rem;cursor:pointer}
.vol-popover{display:none;position:absolute;bottom:50px;left:50%;transform:translateX(-50%);background:var(--bg2);border:1px solid var(--border);padding:15px 10px;border-radius:15px;z-index:100;box-shadow:0 10px 25px rgba(0,0,0,0.5)}
.vol-btn-wrapper{position:relative}
.vol-btn-wrapper:hover .vol-popover{display:block}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.15);border-radius:10px}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,0.3)}
</style>
</head>
<body>

<div class="nav-bar">
  <div class="nav-item active" onclick="switchPage('player')">🎵 Плеер</div>
  <div class="nav-item" onclick="switchPage('search')">🔍 Поиск</div>
  <div class="nav-item" onclick="switchPage('foryou')">✨ Для вас</div>
  <div class="nav-item" onclick="switchPage('library')">📂 Медиатека</div>
</div>

<div class="app-container">
  <main class="main-content">
    
    <!-- PAGE: PLAYER -->
    <div id="page-player" class="page active">
      <div class="player-layout">
        <div class="queue-side">
          <div class="queue-title">Очередь воспроизведения</div>
          <div id="queue-container" class="queue-scroll"></div>
        </div>
        <div class="player-side">
          <div class="cover-wrapper">
            <img id="player-cover" class="cover-img" src="" alt="Cover"/>
            <div id="player-platform" class="platform-badge sc">SC</div>
          </div>
          <div class="track-meta">
            <div id="player-title" class="track-title">Загрузка...</div>
            <div id="player-artist" class="track-artist" onclick="viewArtist(this.innerText)">Подождите</div>
          </div>
          <div class="action-row">
            <button id="btn-like" class="btn-action" onclick="toggleLike()">❤️ Лайк</button>
            <button id="btn-ban" class="btn-action" onclick="banArtist()">🚫 Бан артиста</button>
            <button id="btn-wave" class="btn-action" onclick="toggleWave()">🌊 Умная Волна</button>
            <button class="btn-action" onclick="openPlaylistModal()">+ В плейлист</button>
          </div>
          <div class="timeline-container">
            <input type="range" id="timeline" class="time-slider" min="0" value="0" step="1" oninput="seeking(this.value)" onchange="seekTrack(this.value)"/>
            <div class="time-info">
              <span id="time-current">0:00</span>
              <span id="time-total">0:00</span>
            </div>
          </div>
          <div class="controls-row">
            <button class="btn-ctrl" onclick="doAction('prev')">
              <svg width="24" height="24" fill="currentColor" viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
            </button>
            <button class="btn-ctrl btn-play-trigger" onclick="togglePlay()">
              <svg id="play-icon" width="28" height="28" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            </button>
            <button class="btn-ctrl" onclick="doAction('next')">
              <svg width="24" height="24" fill="currentColor" viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6zm9-12h2v12h-2z"/></svg>
            </button>
          </div>
          <div class="vol-btn-wrapper" style="position: absolute; bottom: 40px; right: 40px;">
            <button class="btn-ctrl">
              <svg width="24" height="24" fill="currentColor" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
            </button>
            <div class="vol-popover">
              <input type="range" id="vol" min="0" max="100" value="70" step="5" class="vol-slider" oninput="setVolume(this.value)"/>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- PAGE: SEARCH -->
    <div id="page-search" class="page">
      <div class="search-box">
        <input type="text" id="search-input" class="search-input" placeholder="Поиск треков, артистов, ремиксов..." onkeydown="if(event.key==='Enter')search()"/>
        <div class="source-filters">
          <div class="filter-chip active" id="f-deezer" onclick="setSource('deezer')">Deezer</div>
          <div class="filter-chip" id="f-soundcloud" onclick="setSource('soundcloud')">SoundCloud</div>
          <div class="filter-chip" id="f-youtube" onclick="setSource('youtube')">YouTube</div>
        </div>
      </div>
      <div id="search-results" class="queue-scroll" style="max-height:none"></div>
    </div>

    <!-- PAGE: FOR YOU -->
    <div id="page-foryou" class="page">
      <div class="section-title">✨ Персональные миксы</div>
      <div id="mixes-container" class="scroll-row"></div>
      <div class="section-title">🔥 Рекомендации для вас</div>
      <div id="recommendations-container" class="queue-scroll" style="max-height:none"></div>
    </div>

    <!-- PAGE: LIBRARY -->
    <div id="page-library" class="page">
      <div class="grid-container">
        <div class="media-tile" onclick="loadSubLibrary('liked')"><span class="tile-icon">❤️</span><span class="tile-title">Любимые треки</span></div>
        <div class="media-tile" onclick="loadSubLibrary('history')"><span class="tile-icon">📜</span><span class="tile-title">История</span></div>
        <div class="media-tile" onclick="loadSubLibrary('playlists')"><span class="tile-icon">📂</span><span class="tile-title">Плейлисты</span></div>
      </div>
      <div id="library-title" class="section-title" style="margin-top:40px; display:none;"></div>
      <div id="library-results" class="queue-scroll" style="max-height:none; margin-top:15px;"></div>
    </div>

  </main>
</div>

<div id="toast" class="toast-msg"></div>

<!-- MODAL: PLAYLISTS -->
<div id="pl-modal" class="modal">
  <div class="modal-content">
    <button class="modal-btn-close" onclick="closePlModal()">×</button>
    <div class="modal-title">Добавить в плейлист</div>
    <div id="modal-pl-list" class="modal-list"></div>
    <div class="modal-input-group">
      <input type="text" id="pl-new-input" class="search-input" style="padding:8px 12px; font-size:0.9rem" placeholder="Новый плейлист..."/>
      <button class="btn-action" onclick="createAndAddPlaylist()">Создать</button>
    </div>
  </div>
</div>

<audio id="audio-player" style="display:none"></audio>

<script>
// ССЫЛКА НА ТВОЙ RENDER
const API_URL = "https://tgplayer.onrender.com";

// Глобальное состояние
const $ = id => document.getElementById(id);
let uid = localStorage.getItem("music_web_user_id");
if(!uid){ uid = "user_" + Math.random().toString(36).substring(2,15); localStorage.setItem("music_web_user_id", uid); }

const HEADERS = { "Content-Type": "application/json", "X-Web-User-Id": uid };
const audio = $("audio-player");
let currentTrack = null;
let searchSource = "deezer";
let isWaveActive = false;
let listenTimer = null;
let secondsListened = 0;
let isSeeking = false;
let _plModalTrack = null;

// Инициализация
window.onload = () => {
  initPlayer();
  setupAudioEvents();
  setVolume($("vol").value);
};

// Переключение страниц
function switchPage(pageId) {
  document.querySelectorAll(".nav-item").forEach(el => el.classList.remove("active"));
  document.querySelectorAll(".page").forEach(el => el.classList.remove("active"));
  event.currentTarget.classList.add("active");
  $("page-" + pageId).classList.add("active");
  
  if (pageId === "foryou") loadForYou();
}

// Загрузка состояния плеера
async function initPlayer() {
  try {
    const r = await fetch(`${API_URL}/api/track`, { headers: HEADERS });
    const data = await r.json();
    if(data && !data.error) {
      renderPlayer(data);
      if(data.queue) renderQueue(data.queue);
    }
  } catch(e) {
    showToast("Ошибка подключения к серверу");
  }
}

// Отрендерить состояние главного плеера
function renderPlayer(track) {
  currentTrack = track;
  $("player-title").innerText = track.title || "Неизвестный трек";
  $("player-artist").innerText = track.artist || "Неизвестный исполнитель";
  $("player-cover").src = track.cover_url || "https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?q=80&w=300&auto=format&fit=crop";
  $("time-total").innerText = track.duration_str || "0:00";
  $("timeline").max = track.duration || 100;
  $("timeline").value = track.progress || 0;
  $("time-current").innerText = formatTime(track.progress || 0);
  
  const likeBtn = $("btn-like");
  if (track.liked) { likeBtn.classList.add("active-like"); } else { likeBtn.classList.remove("active-like"); }

  // Показываем индикатор платформы
  const badge = $("player-platform");
  badge.className = "platform-badge";
  if(track.source === "SoundCloud") { badge.classList.add("sc"); badge.innerText = "SC"; }
  else if(track.source === "YouTube") { badge.classList.add("yt"); badge.innerText = "YT"; }
  else { badge.classList.add("dz"); badge.innerText = "Deezer"; }

  if(track.is_playing && audio.paused) {
    playTrackStream(track);
  }
}

// Отрендерить Очередь слева
function renderQueue(queue) {
  const container = $("queue-container");
  container.innerHTML = "";
  if(!queue || queue.length === 0) {
    container.innerHTML = `<div style="color:var(--muted); text-align:center; margin-top:20px; font-size:0.9rem">Очередь пуста</div>`;
    return;
  }
  queue.forEach((t, index) => {
    const row = document.createElement("div");
    row.className = "track-row";
    row.onclick = () => doAction("jump", { index: index + 1 });
    row.innerHTML = `
      <img class="tr-cover" src="${t.cover_url || ''}"/>
      <div class="tr-meta">
        <div class="tr-title">${t.title}</div>
        <div class="tr-artist">${t.artist}</div>
      </div>
      <div class="tr-duration">${t.duration_str || '0:00'}</div>
    `;
    container.appendChild(row);
  });
}

// Запрос стриминга с бэкенда
function playTrackStream(track) {
  clearInterval(listenTimer);
  secondsListened = 0;

  const streamUrl = `${API_URL}/api/stream?artist=${encodeURIComponent(track.artist)}&title=${encodeURIComponent(track.title)}`;
  audio.src = streamUrl;
  audio.play().catch(() => updatePlayIcon(false));
  updatePlayIcon(true);

  listenTimer = setInterval(() => {
    if(!audio.paused && !isSeeking) {
      secondsListened++;
      if(track.duration && secondsListened >= track.duration * 0.6) {
        clearInterval(listenTimer);
        doActionRaw("session_listen", { track });
      }
    }
  }, 1000);
}

// Базовый экшен на сервер
async function doAction(action, extra = {}) {
  try {
    const res = await doActionRaw(action, extra);
    if(res.message) showToast(res.message);
    if(res.track) {
      renderPlayer(res.track);
      if(res.track.queue) renderQueue(res.track.queue);
    }
    if(action === "like" && res.liked !== undefined) {
      if(res.liked) $("btn-like").classList.add("active-like");
      else $("btn-like").classList.remove("active-like");
    }
  } catch(e) {
    showToast("Не удалось выполнить действие");
  }
}

async function doActionRaw(action, extra = {}) {
  const r = await fetch(`${API_URL}/api/action`, {
    method: "POST", headers: HEADERS,
    body: JSON.stringify({ action, ...extra })
  });
  return r.json();
}

// Плеер: Play/Pause
function togglePlay() {
  if(!currentTrack) return;
  if(audio.paused) {
    if(!audio.src) { playTrackStream(currentTrack); }
    else { audio.play(); updatePlayIcon(true); }
    doActionRaw("play");
  } else {
    audio.pause();
    updatePlayIcon(false);
    doActionRaw("pause");
  }
}

function updatePlayIcon(playing) {
  $("play-icon").innerHTML = playing 
    ? `<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>`
    : `<path d="M8 5v14l11-7z"/>`;
}

// Умная волна
function toggleWave() {
  isWaveActive = !isWaveActive;
  const btn = $("btn-wave");
  if(isWaveActive) {
    btn.classList.add("active-wave");
    showToast("🌊 Умная волна запущена");
    doAction("wave");
  } else {
    btn.classList.remove("active-wave");
    showToast("Волна выключена");
  }
}

// Лайк и Бан
function toggleLike() { if(currentTrack) doAction("like", { track: currentTrack }); }
function banArtist() { if(currentTrack) doAction("ban", { track: currentTrack }); }

// Управление таймлайном
function setupAudioEvents() {
  audio.ontimeupdate = () => {
    if(isSeeking) return;
    $("timeline").value = audio.currentTime;
    $("time-current").innerText = formatTime(audio.currentTime);
    
    if(Math.floor(audio.currentTime) % 5 === 0) {
      doActionRaw("progress_update", { position: Math.floor(audio.currentTime) });
    }
  };
  audio.onended = () => {
    if(isWaveActive) { doAction("wave"); } else { doAction("next"); }
  };
}

function seeking(val) { isSeeking = true; $("time-current").innerText = formatTime(val); }
function seekTrack(val) { audio.currentTime = val; isSeeking = false; doActionRaw("seek", { position: Math.floor(val) }); }
function setVolume(val) { audio.volume = val / 100; }

// ПОИСК
function setSource(src) {
  searchSource = src;
  document.querySelectorAll(".filter-chip").forEach(el => el.classList.remove("active"));
  $("f-" + src).classList.add("active");
}

async function search() {
  const query = $("search-input").value.trim();
  if(!query) return;
  $("search-results").innerHTML = `<div style="text-align:center; padding:30px; color:var(--muted)">Ищу в ${searchSource}...</div>`;
  try {
    const r = await fetch(`${API_URL}/api/search?q=${encodeURIComponent(query)}&source=${searchSource}`, { headers: HEADERS });
    const data = await r.json();
    renderTrackList(data.tracks, $("search-results"), true);
  } catch(e) {
    showToast("Ошибка поиска");
  }
}

function renderTrackList(tracks, targetElement, canClickPlay = true) {
  targetElement.innerHTML = "";
  if(!tracks || tracks.length === 0) {
    targetElement.innerHTML = `<div style="text-align:center; padding:30px; color:var(--muted)">Ничего не найдено</div>`;
    return;
  }
  tracks.forEach(t => {
    const row = document.createElement("div");
    row.className = "track-row";
    if(canClickPlay) {
      row.onclick = () => { doAction("play_track", { track: t }); switchPage("player"); };
    }
    row.innerHTML = `
      <img class="tr-cover" src="${t.cover_url || ''}"/>
      <div class="tr-meta">
        <div class="tr-title">${t.title}</div>
        <div class="tr-artist">${t.artist}</div>
      </div>
      <div class="tr-duration">${t.duration_str || '0:00'}</div>
    `;
    targetElement.appendChild(row);
  });
}

// СТРАНИЦА АРТИСТА
async function viewArtist(artistName) {
  switchPage("search");
  $("search-input").value = artistName;
  $("search-results").innerHTML = `<div style="text-align:center; padding:30px; color:var(--muted)">Загрузка профиля артиста...</div>`;
  try {
    const r = await fetch(`${API_URL}/api/artist/${encodeURIComponent(artistName)}`, { headers: HEADERS });
    const data = await r.json();
    renderTrackList(data.tracks, $("search-results"), true);
  } catch(e) {
    showToast("Не удалось загрузить профиль артиста");
  }
}

// ДЛЯ ВАС
async function loadForYou() {
  $("mixes-container").innerHTML = `<div style="color:var(--muted); padding:15px;">Считаю веса...</div>`;
  try {
    const r = await fetch(`${API_URL}/api/for-you`, { headers: HEADERS });
    const data = await r.json();
    
    $("mixes-container").innerHTML = "";
    if(data.mixes && data.mixes.length > 0) {
      data.mixes.forEach(m => {
        const card = document.createElement("div");
        card.className = "mix-card";
        card.onclick = () => viewArtist(m.artist);
        card.innerHTML = `<span class="mix-icon">💿</span><div class="mix-title" style="font-weight:600; color:#fff">${m.name}</div><div style="font-size:0.75rem; color:var(--muted); margin-top:5px;">На основе прослушиваний</div>`;
        $("mixes-container").appendChild(card);
      });
    } else {
      $("mixes-container").innerHTML = `<div style="color:var(--muted); font-size:0.85rem; padding:15px;">Слушай больше треков, чтобы собрать миксы!</div>`;
    }

    renderTrackList(data.tracks, $("recommendations-container"), true);
  } catch(e) {
    showToast("Ошибка загрузки рекомендаций");
  }
}

// МЕДИАТЕКА
async function loadSubLibrary(type) {
  const title = $("library-title");
  const container = $("library-results");
  title.style.display = "block";
  container.innerHTML = `<div style="color:var(--muted); padding:15px;">Загрузка...</div>`;
  
  if(type === 'liked') title.innerText = "❤️ Любимые треки";
  if(type === 'history') title.innerText = "📜 Последние 50 прослушанных";
  if(type === 'playlists') title.innerText = "📂 Ваши плейлисты";

  try {
    const r = await fetch(`${API_URL}/api/${type}`, { headers: HEADERS });
    const data = await r.json();
    
    if(type === 'playlists') {
      container.innerHTML = "";
      if(!data.playlists || data.playlists.length === 0) {
        container.innerHTML = `<div style="color:var(--muted); padding:15px;">У вас пока нет плейлистов</div>`;
        return;
      }
      data.playlists.forEach(pl => {
        const div = document.createElement("div");
        div.className = "media-tile";
        div.style.textAlign = "left";
        div.style.padding = "15px 20px";
        div.innerHTML = `<div style="font-weight:600; color:#fff; font-size:1.1rem">📁 ${pl.name}</div><div style="font-size:0.8rem; color:var(--muted); margin-top:4px;">Треков: ${pl.tracks ? pl.tracks.length : 0}</div>`;
        div.onclick = () => {
          title.innerText = `📁 Плейлист: ${pl.name}`;
          renderTrackList(pl.tracks, container, true);
        };
        container.appendChild(div);
      });
    } else {
      renderTrackList(data.tracks, container, true);
    }
  } catch(e) {
    showToast("Ошибка загрузки медиатеки");
  }
}

// МОДАЛКА ПЛЕЙЛИСТОВ
async function openPlaylistModal() {
  if(!currentTrack) return;
  _plModalTrack = currentTrack;
  $("pl-modal").classList.add("open");
  $("modal-pl-list").innerHTML = "Загрузка...";
  try {
    const r = await fetch(`${API_URL}/api/playlists`, { headers: HEADERS });
    const data = await r.json();
    $("modal-pl-list").innerHTML = "";
    if(data.playlists && data.playlists.length > 0) {
      data.playlists.forEach(pl => {
        const row = document.createElement("div");
        row.className = "modal-row";
        row.innerText = pl.name;
        row.onclick = () => addToExistingPlaylist(pl.id);
        $("modal-pl-list").appendChild(row);
      });
    } else {
      $("modal-pl-list").innerHTML = `<div style="color:var(--muted); font-size:0.85rem">Нет созданных плейлистов</div>`;
    }
  } catch(e) {}
}

function closePlModal() { $("pl-modal").classList.remove("open"); $("pl-new-input").value = ""; }
async function addToExistingPlaylist(plId) { await doAction("add_to_playlist", { playlist_id: plId, track: _plModalTrack }); closePlModal(); }
async function createAndAddPlaylist() {
  const name = $("pl-new-input").value.trim();
  if (!name) { showToast("Введи название"); return; }
  const r = await doActionRaw("create_playlist", { name });
  if (r && r.playlist_id) {
    await doAction("add_to_playlist", { playlist_id: r.playlist_id, track: _plModalTrack });
  }
  closePlModal();
}

// ДОП ФУНКЦИИ
function showToast(msg) {
  const t = $("toast");
  t.innerText = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 3000);
}

function formatTime(secs) {
  if (isNaN(secs)) return "0:00";
  const m = Math.floor(secs / 60);
  const s = Math.floor(secs % 60);
  return `${m}:${s < 10 ? "0" : ""}${s}`;
}

// ГОРЯЧИЕ КЛАВИШИ
document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT") return;
  if (e.code === "Space")       { e.preventDefault(); togglePlay(); }
  if (e.code === "ArrowRight")  { e.preventDefault(); doAction("next"); }
  if (e.code === "ArrowLeft")   { e.preventDefault(); doAction("prev"); }
});
async function search() {
  const query = document.getElementById("search-input").value.trim();
  if(!query) return;
  try {
    const r = await fetch(`${API_URL}/api/search?q=${encodeURIComponent(query)}&source=${searchSource}`, { headers: HEADERS });
    const data = await r.json();
    renderTrackList(data.tracks, document.getElementById("search-results"), true);
  } catch(e) {
    console.error("Ошибка поиска:", e);
  }
}
</script>
