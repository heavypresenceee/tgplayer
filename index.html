<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>MusicBot Player</title>

  <!-- Tailwind CSS через CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Telegram Mini App SDK — обязательно для работы внутри Telegram -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Google Fonts — красивый шрифт для плеера -->
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />

  <style>
    /* ─── Базовые переменные цветов ─────────────────────────────────── */
    :root {
      --neon-pink:   #f72585;
      --neon-purple: #7209b7;
      --neon-blue:   #3a0ca3;
      --neon-cyan:   #4cc9f0;
      --glass-bg:    rgba(255, 255, 255, 0.07);
      --glass-border: rgba(255, 255, 255, 0.12);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: #0a0012;          /* Глубокий тёмный фон */
      color: #fff;
      min-height: 100vh;
      overflow: hidden;
      position: relative;
      user-select: none;
    }

    /* ─── Анимированный градиентный фон (как в BOOM) ────────────────── */
    .bg-gradient {
      position: fixed;
      inset: 0;
      z-index: 0;
      background: radial-gradient(ellipse at 20% 20%, #7209b7 0%, transparent 50%),
                  radial-gradient(ellipse at 80% 10%, #f72585 0%, transparent 45%),
                  radial-gradient(ellipse at 50% 80%, #3a0ca3 0%, transparent 55%),
                  radial-gradient(ellipse at 90% 90%, #4361ee 0%, transparent 40%);
      animation: bgShift 8s ease-in-out infinite alternate;
      filter: blur(40px);
      opacity: 0.8;
    }

    @keyframes bgShift {
      0%   { transform: scale(1)    rotate(0deg); }
      50%  { transform: scale(1.05) rotate(2deg); }
      100% { transform: scale(1.1)  rotate(-2deg); }
    }

    /* ─── Шум-текстура поверх фона для глубины ──────────────────────── */
    .bg-noise {
      position: fixed;
      inset: 0;
      z-index: 1;
      opacity: 0.04;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      background-size: 150px;
    }

    /* ─── Стеклянные карточки (Glassmorphism) ───────────────────────── */
    .glass {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    /* ─── Основной контейнер плеера ─────────────────────────────────── */
    #app {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 24px 20px 0;
    }

    /* ─── Обложка трека ──────────────────────────────────────────────── */
    #cover-wrap {
      position: relative;
      width: min(320px, 80vw);
      height: min(320px, 80vw);
      margin: 12px 0 20px;
    }

    #cover-wrap::before {
      /* Неоновое свечение под обложкой */
      content: '';
      position: absolute;
      inset: -12px;
      border-radius: 28px;
      background: linear-gradient(135deg, var(--neon-pink), var(--neon-purple), var(--neon-cyan));
      filter: blur(20px);
      opacity: 0.5;
      animation: coverGlow 3s ease-in-out infinite alternate;
      z-index: -1;
    }

    @keyframes coverGlow {
      0%   { opacity: 0.3; transform: scale(0.95); }
      100% { opacity: 0.6; transform: scale(1.02); }
    }

    #cover {
      width: 100%;
      height: 100%;
      border-radius: 20px;
      object-fit: cover;
      display: block;
      transition: transform 0.3s ease;
    }

    #cover.playing { animation: coverPulse 2s ease-in-out infinite; }

    @keyframes coverPulse {
      0%, 100% { transform: scale(1); }
      50%       { transform: scale(1.02); }
    }

    /* ─── Блок с названием трека и кнопками Ban/Wave ────────────────── */
    #track-info {
      width: 100%;
      max-width: 340px;
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 8px;
    }

    #track-text { flex: 1; overflow: hidden; }

    #track-title {
      font-family: 'Unbounded', sans-serif;
      font-size: 16px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      /* Бегущая строка если длинное название */
    }

    #track-artist {
      font-size: 13px;
      color: rgba(255,255,255,0.55);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ─── Кнопки Wave и Ban ──────────────────────────────────────────── */
    .icon-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 1px solid var(--glass-border);
      background: var(--glass-bg);
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
      flex-shrink: 0;
    }

    .icon-btn:active { transform: scale(0.9); }

    .icon-btn.wave:hover  { border-color: var(--neon-cyan);  box-shadow: 0 0 12px var(--neon-cyan); }
    .icon-btn.ban:hover   { border-color: var(--neon-pink);  box-shadow: 0 0 12px var(--neon-pink); }

    /* ─── Полоса прогресса ───────────────────────────────────────────── */
    #progress-wrap {
      width: 100%;
      max-width: 340px;
      margin: 12px 0 4px;
    }

    #progress-bar {
      width: 100%;
      height: 4px;
      -webkit-appearance: none;
      appearance: none;
      border-radius: 4px;
      background: rgba(255,255,255,0.15);
      cursor: pointer;
      outline: none;
    }

    #progress-bar::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--neon-pink);
      box-shadow: 0 0 8px var(--neon-pink);
      cursor: pointer;
      transition: transform 0.2s;
    }

    #progress-bar::-webkit-slider-thumb:hover { transform: scale(1.3); }

    /* Заполненная часть полосы прогресса — неоновый цвет */
    #progress-bar {
      background: linear-gradient(
        to right,
        var(--neon-pink) 0%,
        var(--neon-pink) var(--prog, 0%),
        rgba(255,255,255,0.15) var(--prog, 0%)
      );
    }

    #time-row {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: rgba(255,255,255,0.4);
      margin-top: 6px;
    }

    /* ─── Кнопки управления (Prev, Play/Pause, Next) ─────────────────── */
    #controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 28px;
      margin: 16px 0;
    }

    .ctrl-btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
    }

    .ctrl-btn:active { transform: scale(0.88); }
    .ctrl-btn:hover  { border-color: rgba(255,255,255,0.3); }

    /* ─── Большая кнопка Play/Pause ──────────────────────────────────── */
    #play-btn {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--neon-pink), var(--neon-purple));
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 0 0 0 var(--neon-pink);
    }

    /* Пульсирующее свечение когда играет */
    #play-btn.playing {
      animation: playGlow 1.5s ease-in-out infinite;
    }

    @keyframes playGlow {
      0%   { box-shadow: 0 0 10px 0px var(--neon-pink); }
      50%  { box-shadow: 0 0 25px 8px var(--neon-pink); }
      100% { box-shadow: 0 0 10px 0px var(--neon-pink); }
    }

    #play-btn:active { transform: scale(0.92); }

    /* ─── Выезжающая шторка "Очередь" ───────────────────────────────── */
    #queue-sheet {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 50;
      border-radius: 24px 24px 0 0;
      padding: 16px 20px 32px;
      transform: translateY(calc(100% - 56px)); /* По умолчанию — только заголовок виден */
      transition: transform 0.4s cubic-bezier(0.32, 0.72, 0, 1);
      background: rgba(15, 5, 30, 0.85);
      border-top: 1px solid var(--glass-border);
      backdrop-filter: blur(30px);
    }

    #queue-sheet.open { transform: translateY(0); }

    #queue-handle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      padding-bottom: 12px;
    }

    #queue-handle-bar {
      width: 36px;
      height: 4px;
      border-radius: 2px;
      background: rgba(255,255,255,0.2);
      position: absolute;
      top: 8px;
      left: 50%;
      transform: translateX(-50%);
    }

    .queue-title {
      font-family: 'Unbounded', sans-serif;
      font-size: 13px;
      font-weight: 600;
      color: rgba(255,255,255,0.7);
    }

    /* ─── Элемент очереди ────────────────────────────────────────────── */
    .queue-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .queue-item:last-child { border-bottom: none; }
    .queue-item:active { opacity: 0.6; }

    .queue-cover {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      object-fit: cover;
      background: rgba(255,255,255,0.1);
      flex-shrink: 0;
    }

    .queue-info { flex: 1; overflow: hidden; }

    .queue-track-title {
      font-size: 13px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .queue-track-artist {
      font-size: 11px;
      color: rgba(255,255,255,0.45);
      margin-top: 2px;
    }

    .queue-duration {
      font-size: 11px;
      color: rgba(255,255,255,0.35);
      flex-shrink: 0;
    }

    /* ─── Уведомления (тост) ─────────────────────────────────────────── */
    #toast {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(-80px);
      background: rgba(247, 37, 133, 0.9);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 10px 20px;
      font-size: 13px;
      font-weight: 500;
      z-index: 100;
      transition: transform 0.3s ease;
      white-space: nowrap;
    }

    #toast.show { transform: translateX(-50%) translateY(0); }

    /* ─── Загрузка ───────────────────────────────────────────────────── */
    #loader {
      position: fixed;
      inset: 0;
      z-index: 200;
      background: #0a0012;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      transition: opacity 0.5s ease;
    }

    #loader.hidden { opacity: 0; pointer-events: none; }

    .loader-ring {
      width: 48px;
      height: 48px;
      border: 3px solid rgba(255,255,255,0.1);
      border-top-color: var(--neon-pink);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .loader-text {
      font-family: 'Unbounded', sans-serif;
      font-size: 13px;
      color: rgba(255,255,255,0.5);
    }
  </style>
</head>
<body>

<!-- ══ Анимированный фон ══════════════════════════════════════════════════ -->
<div class="bg-gradient"></div>
<div class="bg-noise"></div>

<!-- ══ Экран загрузки ════════════════════════════════════════════════════ -->
<div id="loader">
  <div class="loader-ring"></div>
  <div class="loader-text">Загрузка плеера...</div>
</div>

<!-- ══ Уведомление (тост) ════════════════════════════════════════════════ -->
<div id="toast"></div>

<!-- ══ Основное приложение ═══════════════════════════════════════════════ -->
<div id="app">

  <!-- Заголовок -->
  <div style="width:100%;max-width:340px;display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">
    <span style="font-family:'Unbounded',sans-serif;font-size:11px;font-weight:600;color:rgba(255,255,255,0.4);letter-spacing:2px;text-transform:uppercase;">Сейчас играет</span>
    <span id="source-badge" style="font-size:10px;padding:3px 8px;border-radius:10px;background:var(--glass-bg);border:1px solid var(--glass-border);color:rgba(255,255,255,0.5);">●  Deezer</span>
  </div>

  <!-- Обложка -->
  <div id="cover-wrap">
    <img id="cover" src="https://via.placeholder.com/320x320/1a0030/ffffff?text=♪" alt="Обложка трека" />
  </div>

  <!-- Название трека + кнопки Wave/Ban -->
  <div id="track-info" style="max-width:340px;">
    <div id="track-text">
      <div id="track-title">Загрузка...</div>
      <div id="track-artist">—</div>
    </div>

    <!-- Кнопка "Волна" — запускает рекомендации по артисту -->
    <button class="icon-btn wave" onclick="sendAction('wave')" title="Запустить волну">
      <!-- Иконка волны (SVG) -->
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--neon-cyan)" stroke-width="2.2" stroke-linecap="round">
        <path d="M2 12 Q5 6, 8 12 Q11 18, 14 12 Q17 6, 20 12 Q22 15, 24 12"/>
      </svg>
    </button>

    <!-- Кнопка "Бан" — добавить артиста в чёрный список -->
    <button class="icon-btn ban" onclick="sendAction('ban')" title="Забанить артиста">
      <!-- Иконка перечёркнутого круга (SVG) -->
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--neon-pink)" stroke-width="2.2">
        <circle cx="12" cy="12" r="9"/>
        <line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/>
      </svg>
    </button>
  </div>

  <!-- Полоса прогресса -->
  <div id="progress-wrap">
    <input
      type="range"
      id="progress-bar"
      min="0" max="100" value="0"
      oninput="onProgressInput(this.value)"
      onchange="onProgressChange(this.value)"
    />
    <div id="time-row">
      <span id="time-current">0:00</span>
      <span id="time-total">0:00</span>
    </div>
  </div>

  <!-- Кнопки управления -->
  <div id="controls">

    <!-- Назад -->
    <button class="ctrl-btn" onclick="sendAction('prev')" title="Предыдущий трек">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="white">
        <path d="M6 6h2v12H6zm3.5 6L20 18V6z"/>
      </svg>
    </button>

    <!-- Play / Pause — главная кнопка -->
    <button id="play-btn" onclick="togglePlay()" title="Воспроизведение / Пауза">
      <svg id="play-icon" width="28" height="28" viewBox="0 0 24 24" fill="white">
        <!-- Иконка Play по умолчанию -->
        <path d="M8 5v14l11-7z"/>
      </svg>
    </button>

    <!-- Вперёд -->
    <button class="ctrl-btn" onclick="sendAction('next')" title="Следующий трек">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="white">
        <path d="M6 18l8.5-6L6 6v12zm2-8.14L11.03 12 8 14.14V9.86zM16 6h2v12h-2z"/>
      </svg>
    </button>

  </div>

</div><!-- /app -->

<!-- ══ Выезжающая шторка "Очередь воспроизведения" ══════════════════════ -->
<div id="queue-sheet" class="glass">
  <!-- Полоска-ручка для перетаскивания -->
  <div id="queue-handle-bar"></div>

  <div id="queue-handle" onclick="toggleQueue()">
    <span class="queue-title">Очередь воспроизведения</span>
    <!-- Стрелка вверх/вниз -->
    <svg id="queue-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="2.5" stroke-linecap="round">
      <polyline points="18 15 12 9 6 15"/>
    </svg>
  </div>

  <!-- Список следующих треков -->
  <div id="queue-list">
    <!-- Заполняется через JavaScript -->
    <div style="text-align:center;color:rgba(255,255,255,0.3);font-size:13px;padding:20px 0;">
      Загрузка очереди...
    </div>
  </div>
</div>

<!-- ════════════════════ JAVASCRIPT ══════════════════════════════════════ -->
<script>
// ── Инициализация Telegram Mini App ──────────────────────────────────────
const tg = window.Telegram.WebApp;
tg.ready();                          // Говорим Telegram что приложение готово
tg.expand();                         // Разворачиваем на весь экран
tg.setHeaderColor('#0a0012');        // Цвет шапки под стиль плеера
tg.setBackgroundColor('#0a0012');    // Цвет фона

// ── URL нашего сервера — ЗАМЕНИ на свой Railway URL ──────────────────────
// Пример: const SERVER_URL = 'https://musicbot-production.up.railway.app'
const SERVER_URL = 'YOUR_SERVER_URL_HERE';

// ── Состояние плеера ──────────────────────────────────────────────────────
let isPlaying = false;               // Играет ли трек сейчас
let currentTrack = null;             // Данные текущего трека
let progressInterval = null;         // Интервал обновления прогресса
let currentProgress = 0;             // Текущий прогресс (секунды)
let totalDuration = 0;               // Полная длительность трека
let queueOpen = false;               // Открыта ли шторка очереди

// ── Вспомогательная функция: секунды → "М:СС" ────────────────────────────
function formatTime(sec) {
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60).toString().padStart(2, '0');
  return `${m}:${s}`;
}

// ── Загрузить данные о треке с сервера ───────────────────────────────────
async function loadTrack() {
  try {
    const userId = tg.initDataUnsafe?.user?.id || 0;
    const res = await fetch(`${SERVER_URL}/api/track?user_id=${userId}`);
    if (!res.ok) throw new Error('Ошибка сервера');
    const data = await res.json();
    updatePlayer(data);
  } catch (e) {
    showToast('Не удалось загрузить трек 😕');
    console.error(e);
  }
}

// ── Обновить интерфейс плеера данными трека ───────────────────────────────
function updatePlayer(data) {
  currentTrack = data;
  totalDuration = data.duration || 0;
  currentProgress = data.progress || 0;
  isPlaying = data.is_playing || false;

  // Обновляем обложку
  document.getElementById('cover').src = data.cover_url || 'https://via.placeholder.com/320x320/1a0030/ffffff?text=♪';

  // Обновляем название и артиста
  document.getElementById('track-title').textContent = data.title || 'Неизвестный трек';
  document.getElementById('track-artist').textContent = data.artist || 'Неизвестный артист';

  // Обновляем источник (Deezer / SoundCloud / YouTube)
  document.getElementById('source-badge').textContent = '●  ' + (data.source || 'Unknown');

  // Обновляем время
  document.getElementById('time-total').textContent = formatTime(totalDuration);
  document.getElementById('time-current').textContent = formatTime(currentProgress);
  updateProgressBar();

  // Обновляем кнопку Play/Pause
  updatePlayButton();

  // Обновляем фоновый градиент под цвет обложки
  if (data.accent_color) {
    document.querySelector('.bg-gradient').style.background =
      `radial-gradient(ellipse at 30% 20%, ${data.accent_color} 0%, transparent 50%),
       radial-gradient(ellipse at 70% 80%, #3a0ca3 0%, transparent 55%),
       radial-gradient(ellipse at 90% 10%, #f72585 0%, transparent 40%)`;
  }

  // Загружаем очередь
  if (data.queue && data.queue.length > 0) {
    renderQueue(data.queue);
  }
}

// ── Обновить визуальный прогресс на полосе ───────────────────────────────
function updateProgressBar() {
  const pct = totalDuration > 0 ? (currentProgress / totalDuration) * 100 : 0;
  const bar = document.getElementById('progress-bar');
  bar.value = pct;
  bar.style.setProperty('--prog', pct + '%');
}

// ── Тик прогресса каждую секунду (когда трек играет) ─────────────────────
function startProgressTick() {
  clearInterval(progressInterval);
  progressInterval = setInterval(() => {
    if (isPlaying && currentProgress < totalDuration) {
      currentProgress++;
      document.getElementById('time-current').textContent = formatTime(currentProgress);
      updateProgressBar();
    }
  }, 1000);
}

// ── Обновить иконку и эффект кнопки Play/Pause ───────────────────────────
function updatePlayButton() {
  const btn  = document.getElementById('play-btn');
  const icon = document.getElementById('play-icon');
  const cover = document.getElementById('cover');

  if (isPlaying) {
    btn.classList.add('playing');
    cover.classList.add('playing');
    // Иконка Pause (две вертикальные полоски)
    icon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
    startProgressTick();
  } else {
    btn.classList.remove('playing');
    cover.classList.remove('playing');
    // Иконка Play (треугольник)
    icon.innerHTML = '<path d="M8 5v14l11-7z"/>';
    clearInterval(progressInterval);
  }
}

// ── Нажатие на Play/Pause ─────────────────────────────────────────────────
function togglePlay() {
  isPlaying = !isPlaying;
  updatePlayButton();
  sendAction(isPlaying ? 'play' : 'pause');
}

// ── Пользователь тащит ползунок (только визуальное обновление) ───────────
function onProgressInput(val) {
  const sec = (val / 100) * totalDuration;
  currentProgress = sec;
  document.getElementById('time-current').textContent = formatTime(sec);
  // Обновляем цвет заполненной части
  document.getElementById('progress-bar').style.setProperty('--prog', val + '%');
}

// ── Пользователь отпустил ползунок — отправляем позицию на сервер ────────
function onProgressChange(val) {
  const sec = Math.floor((val / 100) * totalDuration);
  sendAction('seek', { position: sec });
}

// ── Открыть/закрыть шторку очереди ───────────────────────────────────────
function toggleQueue() {
  queueOpen = !queueOpen;
  const sheet = document.getElementById('queue-sheet');
  const arrow = document.getElementById('queue-arrow');

  if (queueOpen) {
    sheet.classList.add('open');
    // Стрелка вниз (шторка открыта)
    arrow.innerHTML = '<polyline points="6 9 12 15 18 9"/>';
  } else {
    sheet.classList.remove('open');
    // Стрелка вверх (шторка закрыта)
    arrow.innerHTML = '<polyline points="18 15 12 9 6 15"/>';
  }
}

// ── Отрисовать список очереди ─────────────────────────────────────────────
function renderQueue(tracks) {
  const list = document.getElementById('queue-list');
  if (!tracks || tracks.length === 0) {
    list.innerHTML = '<div style="text-align:center;color:rgba(255,255,255,0.3);font-size:13px;padding:20px 0;">Очередь пуста</div>';
    return;
  }

  list.innerHTML = tracks.slice(0, 3).map((t, i) => `
    <div class="queue-item" onclick="sendAction('jump', {index: ${i + 1}})">
      <img class="queue-cover" src="${t.cover_url || 'https://via.placeholder.com/44x44/1a0030/ffffff?text=♪'}" alt="" />
      <div class="queue-info">
        <div class="queue-track-title">${t.title || 'Неизвестно'}</div>
        <div class="queue-track-artist">${t.artist || '—'}</div>
      </div>
      <div class="queue-duration">${formatTime(t.duration || 0)}</div>
    </div>
  `).join('');
}

// ── Отправить действие на сервер ──────────────────────────────────────────
async function sendAction(action, extra = {}) {
  const userId = tg.initDataUnsafe?.user?.id || 0;
  try {
    const res = await fetch(`${SERVER_URL}/api/action`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ user_id: userId, action, ...extra }),
    });
    const data = await res.json();

    // Если сервер вернул обновлённые данные трека — применяем их
    if (data.track) updatePlayer(data.track);
    if (data.message) showToast(data.message);

  } catch (e) {
    console.error('Ошибка отправки действия:', e);
  }
}

// ── Показать уведомление (тост) ───────────────────────────────────────────
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 3000);
}

// ── Скрыть экран загрузки ──────────────────────────────────────────────────
function hideLoader() {
  const loader = document.getElementById('loader');
  loader.classList.add('hidden');
  setTimeout(() => loader.remove(), 500);
}

// ── Запуск при открытии приложения ───────────────────────────────────────
(async function init() {
  await loadTrack();
  hideLoader();
})();
</script>
</body>
